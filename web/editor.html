<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZPZ File JTD エディタ</title>
<style>
:root {
  --chrome: #eceae6; --chrome2: #f6f5f2; --panel: #fbfaf8; --line: #cfccc5; --line2: #e2dfd9;
  --fg: #1f1e1c; --muted: #6e6b64; --accent: #2f5bd3; --accent-bg: #e3eaff; --desk: #8e8d8a;
  --hover: #e0ddd6; --danger: #b4561b; --sel: rgba(47, 91, 211, .28);
  --ui: 13px/1.4 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --chrome: #2b2a28; --chrome2: #33322f; --panel: #2f2e2b; --line: #4a4844; --line2: #3c3a37;
    --fg: #ecebe7; --muted: #a9a69f; --accent: #8aa8ff; --accent-bg: #2c3654; --desk: #1d1d1b; --hover: #3d3b37; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--chrome); color: var(--fg); font: var(--ui); }
button, input, select { font: inherit; color: inherit; }
#app { display: grid; grid-template-rows: auto auto auto 1fr auto auto; height: 100vh; }

/* title */
#titlebar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--chrome); border-bottom: 1px solid var(--line2); font-size: 12px; color: var(--muted); }
#titlebar b { color: var(--fg); font-weight: 600; }
#titlebar .dot { color: var(--accent); display: none; }
#titlebar.modified .dot { display: inline; }

/* menu */
#menubar { display: flex; padding: 0 4px; background: var(--chrome); border-bottom: 1px solid var(--line2); user-select: none; }
.menu { position: relative; }
.menu > button { border: 0; background: none; padding: 4px 9px; border-radius: 4px; cursor: default; white-space: nowrap; }
.menu > button:hover, .menu.open > button { background: var(--hover); }
.menu .u { text-decoration: underline; }
.drop { display: none; position: absolute; top: 100%; left: 0; z-index: 50; min-width: 250px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.menu.open .drop { display: block; }
.drop button { display: flex; width: 100%; justify-content: space-between; gap: 24px; border: 0; background: none; padding: 5px 10px 5px 26px; border-radius: 4px; text-align: left; cursor: default; position: relative; }
.drop button:hover, .drop button.active { background: var(--accent); color: #fff; }
.drop button:disabled { opacity: .45; background: none; color: inherit; }
.drop button .sc { color: var(--muted); font-size: 12px; }
.drop button:hover .sc, .drop button.active .sc { color: #fff; }
.drop button.checked::before { content: "✓"; position: absolute; left: 9px; }
.drop hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 6px; }

/* toolbar */
#toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 4px 6px; background: var(--chrome2); border-bottom: 1px solid var(--line); }
.tb { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 1px solid transparent; background: none; border-radius: 4px; padding: 0; cursor: default; }
.tb:hover { background: var(--hover); }
.tb.on { background: var(--accent-bg); border-color: var(--accent); }
.tb:disabled { opacity: .4; }
.tb svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tb .glyph { font: 600 15px/1 "Hiragino Mincho ProN", "Yu Mincho", serif; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 5px; }
#tb-size { width: 64px; height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 0 4px; }
.colorbar { position: relative; }
.colorbar i { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 3px; border-radius: 1px; background: #c0392b; }

/* main */
#main { display: grid; grid-template-columns: 200px 1fr 236px; min-height: 0; }
#main.no-jump { grid-template-columns: 0 1fr 236px; }
#main.no-palette { grid-template-columns: 200px 1fr 0; }
#main.no-jump.no-palette { grid-template-columns: 0 1fr 0; }
aside { background: var(--panel); overflow: auto; min-width: 0; }
#jump { border-right: 1px solid var(--line); }
#palette { border-left: 1px solid var(--line); }
.paltitle { padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line2); display: flex; justify-content: space-between; }
.tabs { display: flex; border-bottom: 1px solid var(--line2); }
.tabs button { flex: 1; border: 0; background: none; padding: 6px 0; border-bottom: 2px solid transparent; cursor: default; }
.tabs button.on { border-bottom-color: var(--accent); color: var(--accent); }
#pagelist { list-style: none; margin: 0; padding: 4px; }
#pagelist li { display: flex; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: default; }
#pagelist li:hover { background: var(--hover); }
#pagelist li.cur { background: var(--accent-bg); }
#pagelist .n { width: 28px; flex: none; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
#pagelist .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
details.sec { border-bottom: 1px solid var(--line2); }
details.sec > summary { list-style: none; padding: 8px 10px; font-weight: 600; cursor: default; display: flex; justify-content: space-between; }
details.sec > summary::after { content: "▾"; color: var(--muted); }
details.sec:not([open]) > summary::after { content: "▸"; }
.secbody { padding: 2px 10px 10px; display: grid; gap: 8px; }
.row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.row label { color: var(--muted); font-size: 12px; min-width: 44px; }
.pbtn { border: 1px solid var(--line); background: var(--chrome2); border-radius: 4px; padding: 3px 8px; cursor: default; }
.pbtn:hover { background: var(--hover); }
.pbtn.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.pbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.swatch { width: 20px; height: 20px; border-radius: 3px; border: 1px solid var(--line); cursor: default; padding: 0; }
.num { width: 48px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; background: var(--panel); }
.field { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; background: var(--panel); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12px; }
.kv span:nth-child(odd) { color: var(--muted); }
.warn { color: var(--danger); font-size: 12px; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 12px; }

/* document area */
#center { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; background: var(--desk); }
#ruler { height: 22px; background: var(--chrome2); border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
#ruler canvas { position: absolute; left: 0; top: 0; }
#main.no-ruler #ruler { display: none; }
#scroller { overflow: auto; position: relative; outline: none; }
#pages { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 24px 48px; min-width: max-content; }
.page { position: relative; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.18); cursor: text; flex: none; }
.page canvas { position: absolute; left: 0; top: 0; }
.page .sel { position: absolute; background: var(--sel); pointer-events: none; }
.page .no { position: absolute; right: -40px; top: 0; color: #e8e7e3; font-size: 11px; }
#caret { position: absolute; width: 2px; background: #111; pointer-events: none; z-index: 5; animation: blink 1.06s steps(1) infinite; }
#caret.ins { width: 2px; } #caret.ovr { background: rgba(47,91,211,.45); }
@keyframes blink { 50% { opacity: 0; } }
#ime { position: absolute; z-index: 4; width: 2px; height: 20px; padding: 0; border: 0; margin: 0; opacity: 0; resize: none; overflow: hidden; white-space: pre; font-size: 16px; }

/* sheets + status */
#sheettabs { display: none; gap: 2px; padding: 0 8px; background: var(--chrome2); border-top: 1px solid var(--line); }
#sheettabs.show { display: flex; }
#sheettabs button { border: 1px solid var(--line); border-top: 0; background: var(--chrome); padding: 3px 12px; border-radius: 0 0 5px 5px; cursor: default; }
#sheettabs button.on { background: #fff; color: #111; font-weight: 600; }
#statusbar { display: flex; align-items: center; gap: 14px; padding: 3px 10px; background: var(--chrome); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
#statusbar b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
#statusbar .grow { flex: 1; }
#statusbar button { border: 1px solid var(--line); background: var(--chrome2); border-radius: 3px; padding: 0 7px; font-size: 12px; cursor: default; }
#statusbar input[type=range] { width: 110px; }
#app.no-status #statusbar { display: none; }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--panel); color: var(--fg); box-shadow: 0 16px 48px rgba(0,0,0,.3); min-width: 320px; max-width: 92vw; }
dialog::backdrop { background: rgba(0,0,0,.25); }
dialog header { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--line2); }
dialog .body { padding: 14px; display: grid; gap: 10px; }
dialog footer { padding: 10px 14px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line2); }
dialog .opts label { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
dialog table { border-collapse: collapse; font-size: 12px; }
dialog td { padding: 3px 10px 3px 0; vertical-align: top; }
dialog td:first-child { color: var(--muted); white-space: nowrap; }
#dropzone { position: fixed; inset: 0; display: none; place-items: center; background: rgba(47,91,211,.12); border: 3px dashed var(--accent); z-index: 100; font-size: 18px; color: var(--accent); pointer-events: none; }
#dropzone.show { display: grid; }
#toast { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 120; max-width: 80vw; }
#toast.show { opacity: .94; }
#printarea { display: none; }

@media (max-width: 900px) {
  #main, #main.no-jump, #main.no-palette, #main.no-jump.no-palette { grid-template-columns: 1fr; }
  #jump, #palette { display: none; }
  #menubar { overflow-x: auto; }
  #st-note, #statusbar input[type=range] { display: none; }
}
@media print {
  @page { size: A4; margin: 0; }
  html, body { overflow: visible; height: auto; background: #fff; }
  #app { display: none; }
  #printarea { display: block; }
  #printarea img { display: block; width: 210mm; height: 297mm; page-break-after: always; }
}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar"><span class="dot">●</span><b id="docname">無題</b><span>— EZPZ File JTD</span></div>
  <nav id="menubar" aria-label="メニュー"></nav>
  <div id="toolbar"></div>
  <div id="main">
    <aside id="jump" aria-label="ジャンプパレット">
      <div class="tabs"><button data-tab="pages" class="on">ページ</button><button data-tab="info">文書情報</button></div>
      <ul id="pagelist"></ul>
      <div id="infopane" class="secbody" hidden></div>
    </aside>
    <section id="center">
      <div id="ruler"><canvas></canvas></div>
      <div id="scroller" tabindex="-1">
        <div id="pages"></div>
        <div id="caret" hidden></div>
        <textarea id="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="本文入力"></textarea>
      </div>
    </section>
    <aside id="palette" aria-label="ツールパレット"></aside>
  </div>
  <div id="sheettabs"></div>
  <footer id="statusbar">
    <span><b id="st-page">1</b>ページ <b id="st-line">1</b>行 <b id="st-col">1</b>字</span>
    <span>全 <b id="st-pages">1</b> ページ</span>
    <button id="st-mode" title="Insert キーで切り替え">挿入</button>
    <span>文字数 <b id="st-chars">0</b></span>
    <span class="grow"></span>
    <span class="muted" id="st-note"></span>
    <button id="st-marks" title="編集記号の表示">¶</button>
    <button id="st-zout">−</button><input id="st-zoom" type="range" min="50" max="200" step="10" value="100" aria-label="表示倍率"><button id="st-zin">＋</button><b id="st-zv">100%</b>
  </footer>
</div>
<div id="dropzone">ここにドロップして開く（.jtd）</div>
<div id="toast" role="status"></div>
<div id="printarea"></div>
<input id="fileinput" type="file" accept=".jtd,.jtt" hidden>

<dialog id="dlg-save"><form method="dialog">
  <header>名前を付けて保存</header>
  <div class="body">
    <label>ファイル名 <input class="field" id="save-name"></label>
    <div class="opts">
      <label><input type="radio" name="fmt" value="docx" checked> Word 文書 (.docx) <span class="muted">— 表・文字飾り・ルビを保持</span></label>
      <label><input type="radio" name="fmt" value="pdf"> PDF <span class="muted">— 印刷画面から「PDF として保存」</span></label>
      <label><input type="radio" name="fmt" value="html"> Web ページ (.html)</label>
      <label><input type="radio" name="fmt" value="txt"> テキスト (.txt)</label>
      <label><input type="radio" name="fmt" value="md"> Markdown (.md)</label>
      <label><input type="radio" name="fmt" value="jtd" disabled> 一太郎文書 (.jtd) <span class="muted">— 準備中</span></label>
    </div>
  </div>
  <footer><button class="pbtn" value="cancel">キャンセル</button><button class="pbtn primary" value="ok">保存</button></footer>
</form></dialog>

<dialog id="dlg-table"><form method="dialog">
  <header>表作成</header>
  <div class="body">
    <div class="row"><label>行数</label><input class="num" id="tbl-rows" type="number" min="1" max="100" value="3"><label>列数</label><input class="num" id="tbl-cols" type="number" min="1" max="20" value="3"></div>
    <p class="muted" style="margin:0">罫線で囲んだ表を、カーソルのある段落の下に作ります。</p>
  </div>
  <footer><button class="pbtn" value="cancel">キャンセル</button><button class="pbtn primary" value="ok">作成</button></footer>
</form></dialog>

<dialog id="dlg-confirm"><form method="dialog">
  <header id="cf-title">確認</header>
  <div class="body"><p id="cf-text" style="margin:0"></p></div>
  <footer><button class="pbtn" value="cancel">キャンセル</button><button class="pbtn" value="discard" id="cf-discard">保存しない</button><button class="pbtn primary" value="ok" id="cf-ok">OK</button></footer>
</form></dialog>

<dialog id="dlg-info"><form method="dialog">
  <header id="info-title">情報</header>
  <div class="body" id="info-body"></div>
  <footer><button class="pbtn primary" value="ok">閉じる</button></footer>
</form></dialog>

<script type="module">
/*__EZJTD_GLUE__*/
const WASM_B64 = "/*__EZJTD_WASM__*/";
/*__EZJTD_APP__*/
</script>
</body>
</html>
