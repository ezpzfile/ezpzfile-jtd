[workspace]
members = ["crates/ezpzjtd-core", "crates/ezpzjtd-cli", "crates/ezpzjtd-wasm"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ezpzfile/ezpzfile-jtd"
authors = ["EZPZ File <hello@ezpzfile.com>"]

[workspace.dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
