[workspace]
members = ["crates/ezjtd-core", "crates/ezjtd-cli", "crates/ezjtd-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ezpzfile/ezpzfile-jtd"
authors = ["EZPZ File"]

[workspace.dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
